name: Compile Kernel Module

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cross-Compiler & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Download Kernel Source (4.14.357-openela-perf-g8d665610b8b3)
        run: |
          git clone --depth 1 --branch v4.14.357-openela-perf-g8d665610b8b3 https://github.com/openela/kernel-lts.git kernel_src

      - name: Prepare Kernel Headers for Compilation
        run: |
          cd kernel_src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts

      - name: Build Module
        run: |
          cd module
          make

      - name: Upload Compiled .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-module
          path: module/*.ko
          
